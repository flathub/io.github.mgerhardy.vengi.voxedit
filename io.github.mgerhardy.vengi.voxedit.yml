app-id: io.github.mgerhardy.vengi.voxedit
runtime: org.freedesktop.Platform
runtime-version: 25.08
sdk: org.freedesktop.Sdk
command: vengi-voxedit
rename-icon: voxedit-icon
rename-desktop-file: com.github.vengi.voxedit.desktop
rename-appdata-file: io.github.vengi_voxel.vengi.voxedit.metainfo.xml
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=home
  # Required for downloading scripts from voxedit.
  - --share=network
cleanup:
  - /include
  - /share/man
  - /lib/pkgconfig

modules:
  - name: opencl-headers
    buildsystem: simple
    build-commands:
      - mkdir -p /app/include/CL
      - cp -av CL/* /app/include/CL
    sources:
      - type: archive
        url: https://github.com/KhronosGroup/OpenCL-Headers/archive/refs/tags/v2022.01.04.tar.gz
        sha256: 6e716e2b13fc8d363b40a165ca75021b102f9328e2b38f8054d7db5884de29c9

  - name: libdwarf
    buildsystem: meson
    build-options:
      cflags: -Wno-error=calloc-transposed-args
    sources:
      - type: git
        url: https://github.com/davea42/libdwarf-code/
        tag: v0.4.1
        commit: 9416aa9452c37b3ac252e709c39b46705916b97e

  - name: vengi
    buildsystem: cmake-ninja
    config-opts:
      - -DUNITTESTS=OFF
      - -DVISUALTESTS=OFF
      - -DVOXCONVERT=OFF
      - -DTHUMBNAILER=OFF
      - -DPKGDATADIR=/app/share/vengi/
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: git
        url: https://github.com/vengi-voxel/vengi
        tag: v0.6.0
        commit: e8d09475e1488f23e54831575a49c458e8cf3a63
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
